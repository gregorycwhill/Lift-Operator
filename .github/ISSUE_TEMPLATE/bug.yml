name: Bug report
description: Report behaviour that is broken, misleading, or prevents progress.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please paste the diagnostic string copied by Give Feedback. It is copied locally; nothing is sent automatically."
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic string
      placeholder: "Lift Operator | build=..."
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
