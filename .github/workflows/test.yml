name: Test

on:
  push:
  pull_request:

jobs:
  test:
    # Playwright 1.55 supports Ubuntu 24.04; ubuntu-latest moved to 26.04
    # before that Playwright release added compatible browser packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
